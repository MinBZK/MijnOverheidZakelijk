     font-weight="bold"
     fill="#12395F"
     id="text2">MOZA - het testmodel</text>
  <text
     x="70"
     y="76"
     font-size="15px"
     fill="#5a6570"
     id="text3">Vier lagen, elk met één vraag, plus checks die naast de piramide draaien.</text>
  <g
     transform="translate(0,56)"
     id="g45">
    <!-- verticale as -->
    <line
       x1="30"
       y1="560"
