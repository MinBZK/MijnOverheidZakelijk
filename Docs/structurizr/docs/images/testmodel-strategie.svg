    <text
       x="360"
       y="161"
       font-size="14"
       font-weight="bold"
       fill="#ffffff"
       text-anchor="middle"
       id="text8">End-to-end</text>
    <text
       x="360"
       y="238"
       font-size="17"
       font-weight="bold"
       fill="#ffffff"
       text-anchor="middle"
       id="text9">Contract</text>
    <text
