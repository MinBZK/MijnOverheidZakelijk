       text-anchor="middle"
       id="text10">Component</text>
    <text
       x="360"
       y="487"
       font-size="23"
       font-weight="bold"
       fill="#ffffff"
       text-anchor="middle"
       id="text11">Unit</text>
    <!-- verbindingslijnen -->
    <line
       x1="417"
       y1="155"
       x2="674"
       y2="155"
       stroke="#D7DDE3"
       stroke-width="1"
