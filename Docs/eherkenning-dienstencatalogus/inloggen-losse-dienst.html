<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen bij losse dienst</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #9aa1ab;
    --region: #eef0f3;
    --region-inner: #e2e5ea;
    --line: #1f2933;
    --badge: #154273;
    --badge-text: #ffffff;
    --rvo-fill: #dae8fc; --rvo-stroke: #6c8ebf;
    --bd-fill: #d5e8d4;  --bd-stroke: #82b366;
    --justis-fill: #ffe6cc; --justis-stroke: #d79b00;
    --opt1: #7c3aed;
    --opt2: #0e7490;
    --focus: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --surface: #1b1f24; --text: #e5e7eb; --muted: #9ca3af;
      --border: #6b7280; --region: #1b1f24; --region-inner: #242a31; --line: #e5e7eb;
      --badge: #8fb8e8; --badge-text: #0b1520;
      --rvo-fill: #1e3350; --rvo-stroke: #7fa6d9;
      --bd-fill: #1f3a24; --bd-stroke: #8cc276;
      --justis-fill: #4a3214; --justis-stroke: #e0a83a;
      --opt1: #b39af7; --opt2: #4fc3d9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --surface: #1b1f24; --text: #e5e7eb; --muted: #9ca3af;
    --border: #6b7280; --region: #1b1f24; --region-inner: #242a31; --line: #e5e7eb;
    --badge: #8fb8e8; --badge-text: #0b1520;
    --rvo-fill: #1e3350; --rvo-stroke: #7fa6d9;
    --bd-fill: #1f3a24; --bd-stroke: #8cc276;
    --justis-fill: #4a3214; --justis-stroke: #e0a83a;
    --opt1: #b39af7; --opt2: #4fc3d9;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "RijksoverheidSans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1200px; width: 100%; min-width: 0; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; }
  .intro { color: var(--muted); margin: 0 0 20px; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start;
    margin-bottom: 16px;
  }
  .toolbar h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    text-align: left;
    font: inherit; font-size: .85rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px 3px 4px;
  }
  .chip:hover, .chip:focus-visible { border-color: var(--badge); outline: none; }
  .chip .num {
    display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--badge); color: var(--badge-text); font-weight: 700; font-size: .75rem;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; list-style: none; margin: 0; padding: 0; }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .legend svg { flex: none; }

  .canvas {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    overflow-x: auto;
  }
  .canvas svg { display: block; width: 100%; min-width: 760px; height: auto; }

  /* SVG styling */
  .region { fill: var(--region); stroke: var(--border); stroke-width: 3; }
  .region-inner { fill: var(--region-inner); stroke: var(--border); stroke-width: 2.5; }
  .region-label { fill: var(--muted); font-weight: 700; font-size: 17px; }
  .lane { stroke-width: 1.5; stroke-dasharray: 2 4; opacity: .9; }
  .lane-label { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .05em; }
  .node text { fill: var(--text); font-size: 13.5px; pointer-events: none; }
  .node .small { font-size: 11.5px; fill: var(--muted); }
  .provider rect { stroke-width: 3; }
  .rvo { fill: var(--rvo-fill); stroke: var(--rvo-stroke); }
  .bd { fill: var(--bd-fill); stroke: var(--bd-stroke); }
  .justis { fill: var(--justis-fill); stroke: var(--justis-stroke); }
  .service rect { stroke-width: 1.5; }
  .portal rect { stroke-width: 3; }
  .hypo rect { fill: var(--surface); stroke: var(--muted); stroke-width: 1.8; stroke-dasharray: 6 4; }
  .hypo text { fill: var(--muted); }
  .plain rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }

  .edge { fill: none; stroke-width: 2; }
  .edge.solid { stroke: var(--line); }
  .edge.opt1 { stroke: var(--opt1); stroke-dasharray: 7 5; }
  .edge.opt2 { stroke: var(--opt2); stroke-dasharray: 7 5; }
  .offer { stroke-width: 9; stroke-linecap: butt; }
  .offer.rvo { stroke: var(--rvo-stroke); }
  .offer.bd { stroke: var(--bd-stroke); }
  .offer.justis { stroke: var(--justis-stroke); }

  .badge circle { fill: var(--badge); stroke: var(--surface); stroke-width: 2; }
  .badge text { fill: var(--badge-text); font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

  [data-note] { cursor: pointer; }
  [data-note]:focus { outline: none; }
  [data-note]:focus-visible rect, [data-note]:focus-visible circle { stroke: var(--focus); stroke-width: 4; }
  g[data-note]:hover .badge circle, g[data-note]:focus-visible .badge circle { fill: var(--focus); }

  svg.dimmed .node, svg.dimmed .edge, svg.dimmed .offer { opacity: .18; transition: opacity .15s; }
  svg.dimmed .hl { opacity: 1 !important; }
  svg.dimmed .edge.hl { stroke-width: 3; }

  /* Layout met zijpaneel */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); }
  .layout.panel-open { grid-template-columns: minmax(0, 1fr) min(460px, 40vw); }
  .panel {
    position: sticky; top: 0; height: 100vh;
    background: var(--surface); color: var(--text);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(0,0,0,.08);
  }
  .panel[hidden] { display: none; }
  .dlg { display: flex; flex-direction: column; height: 100%; }
  .dlg .body { flex: 1; }
  @media (max-width: 900px) {
    .layout.panel-open { grid-template-columns: minmax(0, 1fr); }
    .layout.panel-open main { padding-bottom: 58vh; }
    .panel {
      position: fixed; top: auto; left: 0; right: 0; bottom: 0; height: 55vh; z-index: 10;
      border-left: none; border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.2);
    }
  }
  /* actief element in het diagram */
  [data-note].active rect { stroke: var(--focus) !important; stroke-width: 4 !important; }
  [data-note].active .badge circle { fill: var(--focus); }
  .dlg header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--region-inner);
  }
  .dlg header .num {
    flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--badge); color: var(--badge-text); font-weight: 700;
  }
  .dlg header h2 { font-size: 1.15rem; margin: 0; flex: 1; }
  .icon-btn {
    font: inherit; font-size: 1.4rem; line-height: 1; cursor: pointer;
    background: none; border: none; color: var(--muted); padding: 4px 8px; border-radius: 6px;
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--region-inner); color: var(--text); outline: none; }
  .dlg .body { padding: 18px 20px 24px; overflow-y: auto; font-size: .95rem; }
  .dlg .body > * + * { margin-top: 14px !important; }
  .dlg .body p { margin: 0; }
  .dlg .body p + p { margin-top: 6px; }
  .dlg .body ul, .dlg .body ol { margin: 6px 0 0; padding-left: 1.2em; }
  .dlg .body li { margin: 4px 0; }
  .dlg .body li::marker { color: var(--muted); }
  .dlg .body a { color: var(--badge); text-underline-offset: 2px; }
  .dlg .body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82em;
    background: var(--region-inner); border-radius: 4px; padding: 1px 5px; white-space: nowrap;
  }
  .dlg .body .sec-title {
    font-size: .98rem; font-weight: 700; margin: 0;
    padding-left: 10px; border-left: 3px solid var(--badge);
  }
  .dlg .body .sub-title {
    font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 22px 0 0 !important;
  }
  .dlg .body .lead { font-size: 1rem; }
  .dlg .body .tag {
    display: inline-block; font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 1px 9px; margin-right: 4px;
    background: var(--region-inner); color: var(--text);
  }
  .dlg .body .tag.yes { background: color-mix(in srgb, var(--bd-stroke) 25%, var(--surface)); }
  .dlg .body .tag.no { background: color-mix(in srgb, #dc2626 18%, var(--surface)); }

  /* veldenlijst */
  .dlg .body .fields { list-style: none; padding: 0; border: 1px solid var(--region-inner); border-radius: 10px; overflow: hidden; }
  .dlg .body .fields li { margin: 0; padding: 7px 12px; }
  .dlg .body .fields li + li { border-top: 1px solid var(--region-inner); }

  /* bronnen */
  .dlg .body .src {
    font-size: .82rem; color: var(--muted); margin-top: 6px;
    display: flex; gap: 6px; align-items: baseline;
  }
  .dlg .body .src::before { content: "↗"; flex: none; font-weight: 700; color: var(--badge); }
  .dlg .body .src i { color: var(--text); }

  /* callouts */
  .callout { border-radius: 10px; padding: 12px 14px; border: 1px solid; }
  .callout-title { font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .callout.info { background: color-mix(in srgb, var(--rvo-stroke) 10%, var(--surface)); border-color: color-mix(in srgb, var(--rvo-stroke) 45%, transparent); }
  .callout.warn { background: color-mix(in srgb, var(--justis-stroke) 12%, var(--surface)); border-color: color-mix(in srgb, var(--justis-stroke) 55%, transparent); }
  .callout.warn .callout-title::before {
    content: "!"; display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--justis-stroke); color: #fff; font-size: .8rem;
  }
  .callout.idea { background: color-mix(in srgb, var(--opt2) 9%, var(--surface)); border-color: color-mix(in srgb, var(--opt2) 45%, transparent); }
  .callout.example { background: var(--region); border-color: var(--region-inner); }
  .callout > * + * { margin-top: 8px; }

  /* citaten */
  .dlg .body blockquote {
    margin: 6px 0 0; padding: 6px 12px; border-left: 3px solid var(--border);
    color: var(--muted); font-size: .9rem;
  }
  .dlg .body blockquote b { color: var(--text); }

  /* vragen */
  .q {
    border-radius: 10px; padding: 10px 14px;
    background: color-mix(in srgb, var(--opt1) 8%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--opt1) 35%, transparent);
    border-left-width: 4px; border-left-color: var(--opt1);
  }
  .q + .q { margin-top: 8px !important; }
  .q-label {
    display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .02em;
    background: var(--opt1); color: #fff; border-radius: 999px; padding: 1px 9px; margin-right: 6px;
    vertical-align: 1px; white-space: nowrap;
  }

  /* voordeel / nadeel */
  .pc { border-radius: 10px; padding: 10px 14px; border: 1px solid; }
  .pc + .pc { margin-top: 8px !important; }
  .pc-label { font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px !important; }
  .pc.pro { background: color-mix(in srgb, var(--bd-stroke) 12%, var(--surface)); border-color: color-mix(in srgb, var(--bd-stroke) 50%, transparent); }
  .pc.pro .pc-label { color: color-mix(in srgb, var(--bd-stroke) 70%, var(--text)); }
  .pc.con { background: color-mix(in srgb, #dc2626 8%, var(--surface)); border-color: color-mix(in srgb, #dc2626 35%, transparent); }
  .pc.con .pc-label { color: color-mix(in srgb, #dc2626 75%, var(--text)); }

  /* stappen */
  .dlg .body .steps { list-style: none; padding: 0; counter-reset: st; }
  .dlg .body .steps li { counter-increment: st; position: relative; padding-left: 34px; min-height: 24px; margin: 8px 0; }
  .dlg .body .steps li::before {
    content: counter(st); position: absolute; left: 0; top: 0;
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    background: var(--region-inner); font-size: .78rem; font-weight: 700;
  }
  .dlg .body .divider {
    display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--muted);
  }
  .dlg .body .divider::before, .dlg .body .divider::after { content: ""; flex: 1; height: 1px; background: var(--region-inner); }
  sup.ref {
    cursor: pointer; color: var(--badge-text); background: var(--badge);
    border-radius: 999px; padding: 0 5px; font-weight: 700; font-size: .7em;
  }
  sup.ref:hover, sup.ref:focus-visible { background: var(--focus); outline: none; }
  .dlg footer {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 20px; border-top: 1px solid var(--region-inner);
  }
  .dlg footer .nav { display: flex; justify-content: space-between; gap: 8px; }
  .dlg footer .related:empty { display: none; }
  .dlg footer .related { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); }
  .nav-btn {
    font: inherit; font-size: .9rem; cursor: pointer;
    background: var(--region-inner); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 12px;
  }
  .nav-btn:disabled { opacity: .4; cursor: default; }
  .nav-btn:not(:disabled):hover { border-color: var(--badge); }
  .crumb { margin: 0 0 10px; }
  .home-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600;
    color: var(--badge); text-decoration: none; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; background: var(--surface);
  }
  .home-btn:hover, .home-btn:focus-visible { border-color: var(--badge); outline: none; }

  :root { --c-bilal: #6b7280; --c-uwv: #6c8ebf; --c-mak: #d79b00; --c-lev: #82b366; --todo: #dc2626; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-bilal: #9ca3af; --c-uwv: #7fa6d9; --c-mak: #e0a83a; --c-lev: #8cc276; --todo: #f87171; } }
  :root[data-theme="dark"] { --c-bilal: #9ca3af; --c-uwv: #7fa6d9; --c-mak: #e0a83a; --c-lev: #8cc276; --todo: #f87171; }
  .a-bilal { --c: var(--c-bilal); } .a-uwv { --c: var(--c-uwv); } .a-mak { --c: var(--c-mak); } .a-lev { --c: var(--c-lev); }
  .lane-bg { fill: color-mix(in srgb, var(--c) 7%, var(--surface)); stroke: none; }
  .lifeline { stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 5 5; }
  .actor rect { fill: color-mix(in srgb, var(--c) 22%, var(--surface)); stroke: var(--c); stroke-width: 2.5; }
  .actor-name { font-weight: 700; font-size: 14px; fill: var(--text); }
  .actor-sub { font-size: 11px; fill: var(--muted); }
  .msg { stroke: var(--c); stroke-width: 2; }
  .msg-label { font-size: 12.5px; fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
  .card { fill: var(--surface); stroke: var(--c); stroke-width: 1.5; }
  .card-title { font-size: 12.5px; font-weight: 700; fill: var(--text); }
  .card-row { font-size: 11.5px; fill: var(--text); }
  .card-row .k { fill: var(--muted); }
  .activity { fill: color-mix(in srgb, var(--c) 22%, var(--surface)); stroke: var(--c); stroke-width: 1.5; }
  .act-label { font-size: 12px; fill: var(--text); }
  .snum circle { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); stroke: var(--c); stroke-width: 2; }
  .snum text, .tbadge text { font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .snum text { fill: var(--text); }
  .snum, .tbadge { cursor: pointer; }
  .snum:focus, .tbadge:focus { outline: none; }
  .tbadge circle { fill: var(--badge); stroke: var(--surface); stroke-width: 2; }
  .tbadge text { fill: var(--badge-text); }
  .snum:hover circle, .snum:focus-visible circle, .step.active .snum circle { stroke: var(--focus); stroke-width: 4; }
  .tbadge:hover circle, .tbadge:focus-visible circle, .tbadge.active circle { fill: var(--focus); }
  .step.active .msg { stroke-width: 4; }
  .step.active .card, .step.active .activity { stroke: var(--focus); stroke-width: 3; }
  svg.focusing .step:not(.active) { opacity: .35; }
  .step { transition: opacity .15s; }

  .chips.steps .chip { padding: 3px; }
  .chip.start { padding: 4px 12px; font-weight: 600; border-color: var(--badge); }
  .crumb { font-size: .85rem; margin: 0 0 8px; }
  .crumb a { color: var(--badge); }

  .dlg header .kind { display: block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .dlg header .num.step-num { background: color-mix(in srgb, var(--c) 30%, var(--surface)); color: var(--text); border: 2px solid var(--c); }
  .route { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .85rem; }
  .actor-chip { border-radius: 999px; padding: 2px 10px; font-weight: 600; border: 1.5px solid var(--c); background: color-mix(in srgb, var(--c) 15%, var(--surface)); }
  .callout.todo { background: color-mix(in srgb, var(--todo) 7%, var(--surface)); border: 1.5px dashed color-mix(in srgb, var(--todo) 60%, transparent); }
  .callout.todo .callout-title { color: var(--todo); }
  .callout.stop { background: color-mix(in srgb, var(--todo) 8%, var(--surface)); border-color: color-mix(in srgb, var(--todo) 35%, transparent); }
</style>
</head>
<body>
<div class="layout" id="layout">
<main>
  <p class="crumb"><a class="home-btn" href="index.html">← Terug naar hoofdpagina</a></p>
  <h1>Bilal logt in bij een losse dienst</h1>
  <p class="intro">Bestaande flow. Klik op een stapnummer voor uitleg per stap, of op een blauw bolletje voor een toelichting. Het paneel verschijnt naast het diagram.</p>

  <div class="toolbar">
    <div>
      <h2>Stappen</h2>
      <div class="chips steps" id="step-chips"><button class="chip start" type="button" id="start">Stap voor stap ▸</button></div>
    </div>
    <div>
      <h2>Toelichtingen</h2>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="canvas">
    <svg id="diagram" viewBox="0 0 1120 1120" role="img" aria-label="Volgordediagram: Bilal logt in bij een losse dienst">
      <defs>
      <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--c-bilal)"/></marker>
      <marker id="arU" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--c-uwv)"/></marker>
      <marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--c-mak)"/></marker>
      <marker id="arL" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--c-lev)"/></marker>
      </defs>
      <rect class="lane-bg a-bilal" x="-5" y="94" width="250" height="1020" rx="14"/>
      <line class="lifeline" x1="120" y1="84" x2="120" y2="1106"/>
      <g class="actor a-bilal"><rect x="5" y="10" width="230" height="74" rx="12"/><text class="actor-name" x="120" y="42" text-anchor="middle">Bilal Yilmaz</text><text class="actor-sub" x="120" y="58" text-anchor="middle">werknemer, op de website van UWV</text></g>
      <rect class="lane-bg a-uwv" x="235" y="94" width="250" height="1020" rx="14"/>
      <line class="lifeline" x1="360" y1="84" x2="360" y2="1106"/>
      <g class="actor a-uwv"><rect x="245" y="10" width="230" height="74" rx="12"/><text class="actor-name" x="360" y="42" text-anchor="middle">UWV</text><text class="actor-sub" x="360" y="58" text-anchor="middle">dienstverlener</text></g>
      <rect class="lane-bg a-mak" x="495" y="94" width="250" height="1020" rx="14"/>
      <line class="lifeline" x1="620" y1="84" x2="620" y2="1106"/>

<template id="note-1" data-title="Betrouwbaarheidsniveau">
  <p>De werkgever schaft eHerkenning aan op een bepaald betrouwbaarheidsniveau. Dat niveau geeft aan hoe grondig de identiteit van Bilal is gecontroleerd bij het aanmaken van zijn account (bijv. wel of geen paspoortscan, wel of geen fysieke controle).</p>
  <p>Bij een inlogpoging vereist de dienst(verlener) een bepaald niveau. In deze stap controleert Z-Login dus of het account van Bilal het juiste niveau heeft voor toegang tot deze dienst.</p>
  <div class="callout stop">
    <p>Heeft het account niet het vereiste niveau, dan stopt de inlogpoging hier.</p>
  </div>
  <div class="callout todo">
    <p class="callout-title">Nog uitwerken</p>
    <p>Verwijzen naar de flows "Karin neemt eHerkenning af" en "Werknemer wordt gemachtigd". Daarbij toevoegen dat Karin kan kiezen om Bilal te machtigen voor "alle diensten met EH2", en dat dát niveau telt, niet het niveau van zijn account. (Klopt dit, en wat is hiervoor de bron?)</p>
  </div>
</template>

<template id="note-2" data-title="Machtigingenregister">
  <p>Elke eHerkenningsleverancier heeft een machtigingenregister. Daarin legt de werkgever vast voor welke diensten een werknemer gemachtigd is. In deze stap raadpleegt de leverancier (Z-Login) dit register.</p>
  <div class="callout info">
    <p><b>NB:</b> logt Bilal in bij een portaaldienst, dan worden de machtigingen voor alle diensten binnen dat portaal in één keer (in bulk) opgevraagd. Zie ook <a href="dienstencatalogus-eherkenning.html">Dienstencatalogus eHerkenning</a>, toelichting 2.</p>
  </div>
  <div class="callout todo">
    <p class="callout-title">Nog uitwerken</p>
    <p>Verwijzen naar de flow "Werknemer wordt gemachtigd".</p>
  </div>
</template>

<template id="note-3" data-title="Assertion en PseudoID">
  <div>
    <p>De leverancier maakt een PseudoID aan voor Bilal en stelt een assertion (verklaring) op dat:</p>
    <ul class="fields">
      <li><code>PseudoID1234</code> gemachtigd is namens <code>KVK-nummer1234</code></li>
      <li>voor het "Werkgeversportaal van UWV"</li>
      <li>en dat de identiteit van deze gebruiker is gecontroleerd op het vereiste betrouwbaarheidsniveau (EH3).</li>
    </ul>
  </div>
  <ol class="steps">
    <li>De assertion gaat naar de makelaar. Die kan het bericht niet ontsleutelen en geeft het ongeopend door aan UWV.</li>
    <li>UWV kan het bericht wel ontsleutelen en weet nu dat Bilal inderdaad mag inloggen.</li>
  </ol>
  <div class="callout info">
    <p class="callout-title">PseudoID per dienst</p>
    <p>Het PseudoID is uniek per dienst: logt Bilal in bij een andere dienst, dan krijgt hij een ander PseudoID. Bij elke inlog op dezelfde dienst is het PseudoID wel steeds hetzelfde.</p>
  </div>
  <p class="sub-title">Vragen</p>
  <div>
    <div class="q"><p><span class="q-label">Vraag (9)</span>Klopt het dat PseudoID's bestaan zodat de dienst niet ziet "wie" Bilal is (persoonsgegevens)?</p></div>
    <div class="q"><p><span class="q-label">Vraag (10)</span>Klopt het dat er per dienst(aanbieder) een apart PseudoID wordt aangemaakt? Wat zijn hierbij de privacyoverwegingen en hoe zwaar wegen die? (Bijv.: zo kan nooit worden achterhaald voor welke diensten persoon Bilal allemaal gemachtigd is → waarom is dat belangrijk?)</p></div>
  </div>
</template>

<script>
(function () {
  const ACT = {"B": {"name": "Bilal", "cls": "a-bilal"}, "U": {"name": "UWV", "cls": "a-uwv"}, "M": {"name": "Makelaar (Digidentity)", "cls": "a-mak"}, "L": {"name": "Leverancier (Z-Login)", "cls": "a-lev"}};
  const STEPS = [{"n": 1, "from_": "B", "to": "M", "title": "Inloggen starten", "text": "Bilal klikt op de website van UWV op \"Inloggen Werkgeversportaal met eHerkenning\".", "payload": null, "note": null}, {"n": 2, "from_": "M", "to": "B", "title": "Verzoek: kies leverancier", "text": "De makelaar vraagt Bilal om zijn eHerkenningsleverancier te selecteren.", "payload": null, "note": null}, {"n": 3, "from_": "B", "to": "M", "title": "Leverancier gekozen", "text": "Bilal selecteert zijn leverancier (Z-Login).", "payload": null, "note": null}, {"n": 4, "from_": "M", "to": "L", "title": "Anoniem inlogverzoek", "text": "De makelaar stuurt een anoniem inlogverzoek naar de leverancier:", "payload": ["ServiceProvider (dienstverlener): \"UWV\"", "ServiceName (dienstnaam): \"Werkgeversportaal\"", "ServiceID (dienstcode): \"Service_ABC123\"", "Vereist niveau: \"EH3\""], "note": null}, {"n": 5, "from_": "L", "to": "B", "title": "Verzoek: inloggegevens", "text": "De leverancier vraagt Bilal zijn gebruikersnaam en wachtwoord in te vullen.", "payload": null, "note": null}, {"n": 6, "from_": "B", "to": "L", "title": "Inloggen bij Z-Login", "text": "Bilal logt in met zijn accountgegevens van Z-Login.", "payload": null, "note": null}, {"n": 7, "from_": "L", "to": null, "title": "Controle betrouwbaarheidsniveau", "text": "Z-Login controleert of het account van Bilal het vereiste niveau (EH3) heeft.", "payload": null, "note": 1}, {"n": 8, "from_": "L", "to": "B", "title": "Verzoek: kies bedrijf", "text": "De leverancier vraagt Bilal namens welk bedrijf hij wil inloggen.", "payload": null, "note": null}, {"n": 9, "from_": "B", "to": "L", "title": "Bedrijf gekozen", "text": "Bilal selecteert Koffiezaak Noon.", "payload": null, "note": null}, {"n": 10, "from_": "L", "to": null, "title": "Controle machtiging", "text": "Z-Login controleert of Bilal namens Noon gemachtigd is voor deze dienst.", "payload": null, "note": 2}, {"n": 11, "from_": "L", "to": "M", "title": "Versleutelde assertion", "text": "De leverancier stuurt een versleutelde assertion (verklaring) naar de makelaar, met daarin dat:", "payload": ["PseudoID1234 gemachtigd is om in te loggen", "namens KVK-nummer1234", "voor Service_ABC123"], "note": 3}, {"n": 12, "from_": "M", "to": "U", "title": "Doorgeven aan UWV", "text": "De makelaar geeft het bericht ongeopend door aan UWV.", "payload": null, "note": null}, {"n": 13, "from_": "U", "to": "B", "title": "Toegang verleend", "text": "Bilal krijgt toegang tot het Werkgeversportaal.", "payload": null, "note": null}];
  const NOTES = [1, 2, 3];
  const NOTE_STEP = {};
  STEPS.forEach(s => { if (s.note) NOTE_STEP[s.note] = s.n; });

  const dlg = document.getElementById('dlg');
  const layout = document.getElementById('layout');
  const svg = document.getElementById('diagram');
  const numEl = document.getElementById('dlg-num');
  const kindEl = document.getElementById('dlg-kind');
  const titleEl = document.getElementById('dlg-title');
  const bodyEl = document.getElementById('dlg-body');
  const relEl = document.getElementById('dlg-related');
  const prevBtn = document.getElementById('dlg-prev');
  const nextBtn = document.getElementById('dlg-next');
  let cur = null;

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const noteTitle = n => document.getElementById('note-' + n).dataset.title;

  function chip(num, label, onClick) {
    const b = el('button', 'chip'); b.type = 'button';
    b.append(el('span', 'num', num));
    if (label) b.append(el('span', 'lbl', label));
    b.addEventListener('click', onClick);
    return b;
  }
  function actorChip(k) { return el('span', 'actor-chip ' + ACT[k].cls, ACT[k].name); }

  function markActive() {
    svg.querySelectorAll('.step').forEach(g => g.classList.toggle('active',
      cur && ((cur.kind === 'step' && +g.dataset.step === cur.n) || (cur.kind === 'note' && +g.dataset.step === NOTE_STEP[cur.n]))));
    svg.querySelectorAll('.tbadge').forEach(b => b.classList.toggle('active', cur && cur.kind === 'note' && +b.dataset.note === cur.n));
    svg.classList.toggle('focusing', !!cur);
  }

  function open() { if (dlg.hidden) { dlg.hidden = false; layout.classList.add('panel-open'); } markActive(); }

  function showStep(n) {
    const s = STEPS.find(x => x.n === n); if (!s) return;
    cur = { kind: 'step', n };
    numEl.className = 'num step-num ' + ACT[s.from_].cls; numEl.textContent = n;
    kindEl.textContent = 'Stap ' + n + ' van ' + STEPS.length; titleEl.textContent = s.title;
    const body = [];
    const route = el('div', 'route');
    route.append(actorChip(s.from_));
    if (s.to) { route.append(el('span', null, '→')); route.append(actorChip(s.to)); }
    else route.append(el('span', 'muted', '(interne controle)'));
    body.push(route);
    body.push(el('p', 'lead', s.text));
    if (s.payload) {
      const ul = el('ul', 'fields');
      s.payload.forEach(p => ul.append(el('li', null, p)));
      body.push(ul);
    }
    if (s.note) {
      const box = el('div', 'callout info');
      box.append(el('p', 'callout-title', 'Bij deze stap hoort een toelichting'));
      const p = el('p'); p.append(chip(s.note, noteTitle(s.note), () => showNote(s.note))); box.append(p);
      body.push(box);
    }
    bodyEl.replaceChildren(...body); bodyEl.scrollTop = 0;
    relEl.replaceChildren();
    prevBtn.disabled = n <= 1; nextBtn.disabled = n >= STEPS.length;
    open();
  }

  function showNote(n) {
    const tpl = document.getElementById('note-' + n); if (!tpl) return;
    cur = { kind: 'note', n };
    numEl.className = 'num'; numEl.textContent = n;
    kindEl.textContent = 'Toelichting ' + n; titleEl.textContent = tpl.dataset.title;
    bodyEl.replaceChildren(tpl.content.cloneNode(true)); bodyEl.scrollTop = 0;
    relEl.replaceChildren(el('span', null, 'Hoort bij:'));
    const s = NOTE_STEP[n];
    relEl.append(chip(s, 'Stap ' + s + ': ' + STEPS[s - 1].title, () => showStep(s)));
    prevBtn.disabled = n <= 1; nextBtn.disabled = n >= NOTES.length;
    open();
  }

  function go(d) { if (!cur) return; (cur.kind === 'step' ? showStep : showNote)(cur.n + d); }

  function closePanel() { dlg.hidden = true; layout.classList.remove('panel-open'); cur = null; markActive(); }

  const stepChips = document.getElementById('step-chips');
  STEPS.forEach(s => { const c = chip(s.n, null, () => showStep(s.n)); c.title = 'Stap ' + s.n + ': ' + s.title; stepChips.append(c); });
  document.getElementById('start').addEventListener('click', () => showStep(1));
  const chips = document.getElementById('chips');
  NOTES.forEach(n => chips.append(chip(n, noteTitle(n), () => showNote(n))));

  function bind(sel, fn) {
    svg.querySelectorAll(sel).forEach(e => {
      e.addEventListener('click', ev => { ev.stopPropagation(); fn(e); });
      e.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fn(e); } });
    });
  }
  bind('.snum', e => showStep(+e.closest('.step').dataset.step));
  bind('.tbadge', e => showNote(+e.dataset.note));

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));
  document.getElementById('dlg-close').addEventListener('click', closePanel);
  document.addEventListener('keydown', e => {
    if (dlg.hidden) return;
    if (e.key === 'Escape') closePanel();
    if (e.key === 'ArrowRight' && !nextBtn.disabled) go(1);
    if (e.key === 'ArrowLeft' && !prevBtn.disabled) go(-1);
  });
})();
</script>
