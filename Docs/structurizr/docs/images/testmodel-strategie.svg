    <text
       x="20"
       y="314"
       font-size="11"
       fill="#98A2AC"
       text-anchor="middle"
       transform="rotate(-90 20 314)"
       id="text4">minder tests · langere looptijd</text>
    <!-- lagen -->
    <polygon
       points="360,69.23 390,120 330,120"
