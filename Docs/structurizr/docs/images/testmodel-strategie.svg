    <line
       x1="462"
       y1="232"
       x2="674"
       y2="232"
       stroke="#D7DDE3"
       stroke-width="1"
       id="line12" />
    <line
       x1="524"
       y1="337"
       x2="674"
       y2="337"
       stroke="#D7DDE3"
       stroke-width="1"
       id="line13" />
    <line
       x1="609"
       y1="480"
       x2="674"
       y2="480"
       stroke="#D7DDE3"
       stroke-width="1"
       id="line14" />
    <!-- toelichting per laag -->
    <text
       x="690"
       y="136"
       font-size="15"
       font-weight="bold"
       fill="#12395F"
       id="text14">End-to-end</text>
    <text
       x="690"
       y="155"
       font-size="13"
       fill="#333A42"
       id="text15">Werken de gedeployde services samen voor de belangrijkste journeys?</text>
    <text
       x="690"
       y="174"
       font-size="12"
       fill="#6B7681"
       id="text16">Bewust de kleinste laag: kan als enige falen buiten de wijziging om.</text>
    <text
       x="690"
       y="213"
       font-size="15"
       font-weight="bold"
       fill="#12395F"
       id="text18">Contract</text>
    <text
       x="690"
       y="232"
       font-size="13"
       fill="#333A42"
       id="text19">Zijn provider en consumers het eens, zonder samen te deployen?</text>
    <text
       x="690"
       y="251"
       font-size="12"
       fill="#6B7681"
       id="text20">Een laag, geen check: dekt R4 af, dat geen andere laag kan bereiken.</text>
    <text
       x="690"
       y="318"
       font-size="15"
       font-weight="bold"
       fill="#12395F"
       id="text22">Component / API-integratie</text>
    <text
       x="690"
       y="337"
       font-size="13"
       fill="#333A42"
       id="text23">Gedraagt de deploybare eenheid zich correct van buitenaf?</text>
    <text
       x="690"
       y="356"
       font-size="12"
       fill="#6B7681"
       id="text24">Alles daarbuiten gestubd op de transportgrens, alles erbinnen echt.</text>
    <text
       x="690"
       y="373"
       font-size="12"
       fill="#6B7681"
       id="text25">De breedste laag die niets anders nodig heeft dan die eenheid zelf,</text>
    <text
       x="690"
       y="390"
       font-size="12"
       fill="#6B7681"
       id="text25b">en dus de plek waar het meeste functionele risico wordt afgehandeld.</text>
    <text
       x="690"
       y="409"
       font-size="11.5"
       font-style="italic"
       fill="#6B7681"
       id="text26">Functioneel en acceptatie is geen vijfde laag: zelfde mechanisme, andere intentie.</text>
    <text
       x="690"
       y="461"
       font-size="15"
       font-weight="bold"
       fill="#12395F"
       id="text27">Unit</text>
    <text
       x="690"
       y="480"
       font-size="13"
       fill="#333A42"
       id="text28">Is dit stuk logica op zichzelf correct?</text>
    <text
       x="690"
       y="499"
       font-size="12"
       fill="#6B7681"
       id="text29">De enige laag die snel genoeg is om bij elke compilatie te draaien,</text>
    <text
       x="690"
       y="516"
       font-size="12"
       fill="#6B7681"
       id="text30">en de enige waar een randgeval goedkoop is.</text>
    <!-- vuistregel -->
    <line
       x1="70"
       y1="592"
       x2="1130"
       y2="592"
       stroke="#E3E7EB"
       stroke-width="1"
       id="line30" />
    <text
       x="70"
       y="618"
       font-size="13"
       fill="#5A6570"
       id="text31">Toewijzingsregel: businesslogica en randgevallen → unit · gedrag van buitenaf, persistentie, serialisatie, foutafhandeling → component</text>
    <text
       x="70"
       y="637"
       font-size="13"
       fill="#5A6570"
       id="text32">· verwachtingen van een ander team → contract · alleen ketenbrede journeys → e2e. Test lagere logica niet opnieuw in een hogere laag.</text>
    <!-- niet-functionele checks -->
    <text
       x="70"
       y="662"
       font-size="14px"
       font-weight="bold"
       fill="#4a5568"
       id="text33">Naast de piramide - kwaliteits- en niet-functionele checks, met een eigen frequentie:</text>
    <rect
       x="70"
       y="678"
       width="340"
       height="60"
       rx="4"
       fill="#F4F6F8"
       stroke="#DDE3E8"
       id="rect33" />
    <text
       x="88"
       y="702"
       font-size="13"
       font-weight="bold"
       fill="#12395F"
       id="text34">Fuzzing</text>
    <text
       x="88"
       y="722"
       font-size="11.5"
       fill="#333A42"
       id="text35">Crasht of breekt de eenheid op onverwachte invoer?</text>
    <rect
       x="430"
       y="678"
       width="340"
       height="60"
       rx="4"
       fill="#F4F6F8"
       stroke="#DDE3E8"
       id="rect37" />
    <text
       x="448"
       y="702"
       font-size="13"
       font-weight="bold"
       fill="#12395F"
       id="text38">Security</text>
    <text
       x="448"
       y="722"
       font-size="11.5"
       fill="#333A42"
       id="text39">Zijn we blootgesteld aan bekende aanvalsklassen?</text>
    <rect
       x="790"
       y="678"
       width="340"
       height="60"
       rx="4"
       fill="#F4F6F8"
       stroke="#DDE3E8"
       id="rect41" />
    <text
       x="808"
       y="702"
       font-size="13"
       font-weight="bold"
       fill="#12395F"
       id="text42">Performance</text>
    <text
       x="808"
       y="722"
       font-size="11.5"
       fill="#333A42"
       id="text43">Is het snel en stabiel onder realistische load?</text>
  </g>
